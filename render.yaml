# Static informational presence only; no backend or encryption service is deployed.
services:
  - type: web
    runtime: static
    name: e2ee-suite-information
    repo: https://github.com/neophilism/End-To-End-Everywhere-Suite
    branch: main
    buildCommand: python3 scripts/check-public-site.py
    staticPublishPath: ./site/public
    autoDeployTrigger: checksPass
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
