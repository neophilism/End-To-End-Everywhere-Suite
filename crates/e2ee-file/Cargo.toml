[package]
name = "e2ee-file"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chunked E2EESA attachment/file encryption for End-To-End Everywhere Suite"

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
e2ee-capsule = { path = "../e2ee-capsule" }
e2ee-message = { path = "../e2ee-message" }
getrandom = "=0.4.3"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
zeroize = "=1.8.2"

[lints]
workspace = true
