name: Pre-alpha CLI packages

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/package-prealpha.sh"
      - ".github/workflows/prealpha-packages.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/package-prealpha.sh"
      - ".github/workflows/prealpha-packages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  packages:
    name: Test and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reuse Rust dependency and compile cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('Cargo.lock') }}-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('Cargo.lock') }}-
      - name: Test Rust workspace on host OS
        run: cargo test --workspace --all-targets --locked
      - name: Build release CLI on host OS
        run: cargo build -p e2ee-cli --release --locked
      - name: Package unsigned CLI test build
        shell: bash
        run: |
          platform="$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          sh scripts/package-prealpha.sh target/release/e2ee "$platform" dist
          test -f "dist/e2ee-prealpha-$platform.tar.gz"
          tar tzf "dist/e2ee-prealpha-$platform.tar.gz"
      - name: Upload engineering artifacts (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2ee-prealpha-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
