name: E2EESA status record
on:
  pull_request:
    paths: ['security/**', 'scripts/validate_e2eesa_status.py', 'docs/E2EESA_ADOPTION.md', 'README.md']
  push:
    branches: [main]
    paths: ['security/**', 'scripts/validate_e2eesa_status.py', 'docs/E2EESA_ADOPTION.md', 'README.md']
permissions:
  contents: read
jobs:
  status-record:
    name: Status record integrity (not product certification)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_e2eesa_status.py
