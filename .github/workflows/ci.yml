name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reuse Rust dependency and compile cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('Cargo.lock') }}-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('Cargo.lock') }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build
        run: cargo build --workspace --all-targets --locked

  standards-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Suite checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pinned E2EESA catalog checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neophilism/End-To-End-Everywhere-Security-Architecture-Standard
          ref: cef6052bdb3bcf45ca0bd3e29d18a519d8f041e0
          path: .e2eesa-upstream
          persist-credentials: false
      - name: Registry compatibility inventory
        run: python3 scripts/check_e2eesa_binding.py --standard-root .e2eesa-upstream
      - name: Binding checker regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
